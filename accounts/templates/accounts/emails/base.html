<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>notifyhub email</title>
</head>
<body style="margin:0;padding:32px 16px;background:#f3f4f6;font-family:Arial,sans-serif;">
    <div style="max-width:520px;margin:auto;background:#fff;border-radius:12px;padding:36px;">
        <h2 style="color:#2563eb;margin-top:0;">NotifyHub</h2>

        {% block content %}{% endblock %}

        <hr style="border:0;border-top:1px solid #e5e7eb;margin-top:32px;">
        <p style="font-size:12px;color:#6b7280;">
            This is an automated message from NotifyHub.
        </p>
    </div>
</body>
</html>
